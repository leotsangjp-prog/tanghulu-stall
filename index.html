<title>串串甜糖葫蘆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: fixed 1280×720 stage scaled to fit — night-market street on top (customers + straw rack), stall kitchen below. Single committed night look. */
:root{
  --night:#1b1033;      /* night sky / page */
  --plum:#3b1a40;       /* far street haze */
  --haw:#c81e2c;        /* hawthorn red, primary accent */
  --glaze:#ffb547;      /* sugar glaze amber */
  --bamboo:#e9cc8e;     /* bamboo skewer / straw */
  --paper:#fff3dc;      /* bubbles, modals */
  --ink:#2b150e;        /* text on paper */
  --wood:#4a2516;       /* stall wood */
  --wood2:#2e160d;
  --jade:#3aa56a;       /* good / ok */
  --warn:#e8a21c;
  --bad:#d7372b;
  --f-disp:"LXGW WenKai TC","Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--paper);font-family:var(--f-body)}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,#2a1640,var(--night) 70%)}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;background:var(--night);border-radius:6px}
button{font-family:var(--f-body)}
button:focus-visible,[data-act]:focus-visible{outline:3px solid var(--glaze);outline-offset:2px}

/* HUD */
#hud{position:absolute;left:0;top:0;width:1280px;height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;background:linear-gradient(#120a22,#1b1033);z-index:20;border-bottom:2px solid #000}
.pill{height:38px;border-radius:19px;background:#2a1838;border:2px solid #5a3a52;display:flex;align-items:center;padding:0 14px;font-weight:700;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.day{background:var(--haw);border-color:#ff7a6a;font-family:var(--f-disp);font-size:20px}
.pbar{flex:1;position:relative;height:38px;border-radius:19px;background:#2a1838;border:2px solid #5a3a52;overflow:hidden}
.pbar .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#b8481c,var(--glaze));transition:width .25s}
.pbar .lbl{position:absolute;left:14px;top:0;line-height:34px;font-weight:700;font-size:16px;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums}
.pbar .star{position:absolute;top:0;line-height:34px;font-size:20px;color:#6a4a62;transform:translateX(-50%);text-shadow:0 1px 1px #000}
.pbar .star.on{color:#ffe07a}
.pill small{font-size:13px;opacity:.8;margin-left:6px;font-weight:500}
.ibtn{width:42px;height:38px;border-radius:19px;background:#2a1838;border:2px solid #5a3a52;color:var(--paper);font-size:16px;font-weight:900;cursor:pointer}
.ibtn:hover{border-color:var(--glaze)}

/* Scene */
#scene{position:absolute;left:0;top:56px;width:1280px;height:374px;overflow:hidden}
#scene>svg.bg{position:absolute;inset:0}
#awn{position:absolute;left:0;top:0;width:1280px;height:40px;z-index:6;pointer-events:none}
#custs{position:absolute;inset:0;z-index:3}
#counter{position:absolute;left:0;top:300px;width:1280px;height:74px;z-index:5;pointer-events:none}
#deco{position:absolute;inset:0;z-index:2;pointer-events:none}
#decoF{position:absolute;inset:0;z-index:6;pointer-events:none}
#rack{position:absolute;left:8px;top:150px;width:270px;height:224px;z-index:7}

.cust{position:absolute;top:44px;width:180px;height:330px;transition:left 1s cubic-bezier(.3,.7,.4,1);cursor:pointer}
.cust .fig{position:absolute;left:10px;top:84px;width:160px;height:220px;transition:transform .2s}
.cust.walk .fig{animation:bob .32s infinite alternate ease-in-out}
@keyframes bob{to{transform:translateY(-6px)}}
.cust .bub{position:absolute;left:50%;top:0;transform:translateX(-50%);background:var(--paper);color:var(--ink);border-radius:16px;padding:6px 8px 8px;border:3px solid var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;gap:5px;min-width:86px;transition:opacity .3s,transform .3s}
.cust .bub::after{content:"";position:absolute;left:50%;bottom:-11px;width:16px;height:16px;background:var(--paper);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.cust.walk .bub,.cust.gone .bub{opacity:0;transform:translateX(-50%) translateY(8px)}
.ord{display:flex;gap:4px;justify-content:center}
.oi{width:60px;display:flex;flex-direction:column;align-items:center;position:relative}
.oi svg{height:56px;width:auto}
.oi b{font-size:12px;line-height:1.1;font-weight:700;white-space:nowrap}
.oi.done{opacity:.35}
.oi.done::after{content:"✓";position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:30px;font-weight:900;color:var(--jade)}
.patb{height:8px;border-radius:4px;background:#e2cfae;overflow:hidden}
.patb i{display:block;height:100%;background:var(--jade);transition:background .3s}
.cust .say{position:absolute;left:50%;top:-34px;transform:translateX(-50%);white-space:nowrap;background:#1b1033e6;color:var(--paper);font-size:14px;padding:4px 10px;border-radius:12px;border:1px solid #6a4a72;opacity:0;transition:opacity .3s;pointer-events:none;font-weight:500}
.cust .say.on{opacity:1}
.cust .who{font-size:12px;font-weight:900;color:var(--haw);text-align:center;margin-bottom:-3px}
.cust.hl .fig{filter:drop-shadow(0 0 10px var(--glaze))}

/* Rack (straw bale) */
.rslot{position:absolute;width:36px;height:140px;cursor:pointer;transition:transform .15s}
.rslot svg{width:100%;height:100%}
.rslot.sel{transform:translateY(-14px);filter:drop-shadow(0 0 8px #fff6b0) drop-shadow(0 0 3px var(--glaze))}
.rslot.empty{cursor:default}
#rack .cap{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:13px;font-weight:700;color:var(--ink);z-index:3;pointer-events:none}

/* Kitchen */
#kitchen{position:absolute;left:0;top:430px;width:1280px;height:290px;background:linear-gradient(#3a1d10,#24120a);border-top:4px solid #000}
#kitchen::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 158px,rgba(0,0,0,.18) 158px 160px);pointer-events:none}
.st{position:absolute;top:10px;height:270px;border-radius:12px;cursor:pointer}
.plate{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);background:var(--wood2);color:var(--bamboo);border:2px solid #000;border-radius:8px;padding:2px 10px;font-size:14px;font-weight:700;white-space:nowrap;z-index:5;font-variant-numeric:tabular-nums}
.lock{position:absolute;inset:0;background:rgba(15,8,20,.78);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--bamboo);font-weight:700;font-size:15px;z-index:8;text-align:center;border:2px dashed #6a4a40}
.badge{position:absolute;width:64px;display:flex;flex-direction:column;align-items:center;gap:1px}
.badge .av{width:44px;height:44px;border-radius:50%;background:var(--paper);border:3px solid var(--glaze);overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.badge b{font-size:11px;color:#fff;background:rgba(0,0,0,.7);border-radius:6px;padding:0 5px;white-space:nowrap}
.lock small{font-weight:500;opacity:.8;font-size:12px}
.st.hl,.bin.hl{box-shadow:0 0 0 3px var(--glaze),0 0 18px var(--glaze)}

.tap svg{position:absolute;left:0;top:0}
.board{width:120px;background:rgba(0,0,0,.22);border:2px solid rgba(0,0,0,.4)}
.board.act{box-shadow:0 0 0 3px #fff2b0,0 0 16px var(--glaze)}
.board .cb{position:absolute;left:10px;top:8px;width:100px;height:212px;border-radius:14px;background:linear-gradient(90deg,#d6a467,#e8bd80 40%,#d09a5c);border:3px solid #6a3a1a}
.board .sk{position:absolute;left:34px;top:22px;width:52px;height:200px}
.board .cnt{position:absolute;left:14px;right:14px;top:188px;text-align:center;font-size:13px;color:var(--ink);font-weight:900;background:rgba(255,240,210,.85);border-radius:8px;padding:2px 0;line-height:1.3}
.pot{width:380px}
.pot .slot{position:absolute;top:12px;width:66px;height:162px;display:flex;justify-content:center;z-index:2}
.pot .slot svg{height:160px;width:auto}
.pot .bars{position:absolute;left:0;right:0;top:204px;height:12px;z-index:4}
.pot .bar{position:absolute;width:56px;height:12px;border-radius:6px;background:rgba(0,0,0,.55);border:2px solid #000;overflow:hidden}
.pot .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--glaze)}
.pot .bar.done i{background:linear-gradient(90deg,#ffe27a,#ffb547)}
.pot .bar.warn{animation:flash .25s infinite alternate}
.pot .bar.burnt i{background:#3a1a0a}
@keyframes flash{to{border-color:var(--bad);box-shadow:0 0 8px var(--bad)}}
.pot .msg{position:absolute;left:0;right:0;top:120px;text-align:center;font-size:18px;font-weight:900;color:#fff;z-index:6;text-shadow:0 2px 4px #000;pointer-events:none}
.side{width:110px;height:130px}
.side.b2{top:150px}
.bins{position:absolute;left:924px;top:10px;width:342px;height:270px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:8px}
.bin{position:relative;border-radius:12px;background:linear-gradient(#6a3a1e,#4a2412);border:3px solid #2a1206;cursor:pointer;overflow:hidden}
.bin svg{position:absolute;left:0;top:0;width:100%;height:100%}
.bin:active,.st:active{transform:translateY(1px)}
.bin .plate{bottom:3px;font-size:13px;padding:1px 8px}

/* Hint, toasts, floats */
#hint{position:absolute;left:50%;top:62px;transform:translateX(-50%);z-index:15;background:#1b1033ee;border:2px solid var(--glaze);color:#fff;font-size:17px;font-weight:700;padding:6px 18px;border-radius:20px;white-space:nowrap;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.5)}
#toast{position:absolute;left:50%;top:388px;transform:translateX(-50%);z-index:30;background:var(--paper);color:var(--ink);font-weight:700;font-size:17px;padding:8px 20px;border-radius:20px;border:3px solid var(--ink);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
.float{position:absolute;z-index:40;font-weight:900;font-size:24px;color:#ffe27a;text-shadow:0 2px 0 #000,0 0 6px #000;pointer-events:none;animation:up 1.1s forwards;font-variant-numeric:tabular-nums;white-space:nowrap}
.float.bad{color:#ff8a7a}
@keyframes up{from{transform:translate(-50%,0)}to{transform:translate(-50%,-60px);opacity:0}}
#banner{position:absolute;left:0;right:0;top:250px;text-align:center;font-family:var(--f-disp);font-size:72px;font-weight:700;color:var(--glaze);text-shadow:0 4px 0 #6a1010,0 0 30px rgba(255,140,40,.6);z-index:35;pointer-events:none;opacity:0;transform:scale(.8);transition:all .35s}
#banner.on{opacity:1;transform:scale(1)}

/* Modal */
#modal{position:absolute;inset:0;z-index:50;background:rgba(10,5,18,.72);display:flex;align-items:center;justify-content:center}
.card{background:var(--paper);color:var(--ink);border-radius:20px;border:4px solid var(--ink);box-shadow:0 8px 0 rgba(0,0,0,.4);padding:26px 30px;max-width:760px;width:760px;max-height:660px;overflow:auto;position:relative}
.card h2{font-family:var(--f-disp);font-size:38px;margin:0 0 6px;color:var(--haw);text-wrap:balance}
.card h3{font-size:18px;margin:16px 0 8px}
.card p{font-size:16px;line-height:1.65;margin:6px 0}
.btns{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.btn{font-size:18px;font-weight:900;padding:10px 22px;border-radius:14px;border:3px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.btn.pri{background:var(--haw);color:#fff}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.goals{display:flex;gap:10px;margin:12px 0}
.goal{flex:1;background:#f5e2bf;border-radius:12px;padding:10px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.goal span{display:block;color:#b5781a;font-size:22px}
.ev{display:flex;gap:14px;align-items:center;background:#2b150e;color:var(--paper);border-radius:14px;padding:12px 16px;margin:10px 0}
.ev .ic{font-size:34px}
.ev b{font-size:18px;color:var(--glaze)}
.news{display:flex;gap:14px;align-items:center;background:#ffe7b8;border:2px dashed #c88a2a;border-radius:14px;padding:10px 16px;margin:10px 0}
.news svg{height:64px;width:auto;flex:none}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 20px;font-size:17px;margin:12px 0;font-variant-numeric:tabular-nums}
.sum b{text-align:right}
.sum .tot{border-top:2px solid var(--ink);padding-top:6px;font-size:20px}
.bigstars{font-size:56px;letter-spacing:8px;text-align:center;color:#d9c7a7;margin:4px 0}
.bigstars .on{color:#f2b41c;text-shadow:0 3px 0 #8a5a0a}
.tabs{display:flex;gap:8px;margin:10px 0}
.tab{padding:6px 16px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:700;cursor:pointer;font-size:16px}
.tab.on{background:var(--ink);color:var(--paper)}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.up{background:#fff;border:2px solid #d9c09a;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.up b{font-size:16px}
.up p{font-size:13px;margin:0;line-height:1.45;flex:1;color:#5a3a2a}
.up .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.up .price{font-weight:900;color:var(--haw);font-variant-numeric:tabular-nums}
.up .sbtn{font-size:14px;font-weight:900;padding:5px 12px;border-radius:10px;border:2px solid var(--ink);background:var(--glaze);color:var(--ink);cursor:pointer}
.up .sbtn[disabled]{opacity:.4;cursor:not-allowed}
.up.done{opacity:.55}
.wallet{position:absolute;right:26px;top:26px;font-weight:900;font-size:20px;color:var(--haw);font-variant-numeric:tabular-nums}
.how{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;font-size:16px;line-height:1.5}
.how .n{width:32px;height:32px;border-radius:16px;background:var(--haw);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}

/* Home */
#home{position:absolute;inset:0;z-index:45;overflow:hidden}
#home svg.hbg{position:absolute;inset:0}
.logo{position:absolute;left:90px;top:120px;font-family:var(--f-disp);font-weight:700}
.logo .t1{font-size:120px;line-height:1;color:var(--glaze);text-shadow:0 6px 0 #7a1010,0 0 40px rgba(255,150,50,.45);letter-spacing:4px}
.logo .t2{font-size:44px;color:var(--paper);margin-top:14px;letter-spacing:10px;text-shadow:0 3px 0 #000}
.logo .t3{font-family:var(--f-body);font-size:17px;color:var(--bamboo);margin-top:16px;max-width:520px;line-height:1.6;font-weight:500}
.hbtns{position:absolute;left:90px;top:470px;display:flex;gap:14px;flex-wrap:wrap;width:640px}
.hbtns .btn{font-size:20px}
.hstat{position:absolute;left:90px;top:560px;color:var(--bamboo);font-size:15px;font-variant-numeric:tabular-nums}

#rotate{position:fixed;inset:0;z-index:99;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--paper);font-size:20px;font-weight:700;text-align:center;padding:24px}
#rotate .ph{width:70px;height:110px;border:5px solid var(--glaze);border-radius:14px;animation:rot 1.6s infinite ease-in-out}
@keyframes rot{50%{transform:rotate(-90deg)}}
#rotate button{font-size:15px;padding:8px 16px;border-radius:12px;border:2px solid var(--bamboo);background:transparent;color:var(--bamboo)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>

<div id="wrap"><div id="stage">
  <div id="hud">
    <div class="pill day" id="hDay">第 1 天</div>
    <div class="pbar"><div class="fill" id="hFill"></div><div class="lbl" id="hProfit">淨利 $0</div><span class="star" id="s1">★</span><span class="star" id="s2">★</span><span class="star" id="s3">★</span></div>
    <div class="pill" id="hClock">18:00<small>開檔</small></div>
    <div class="pill" id="hCoins">銀包 $200</div>
    <button class="ibtn" data-act="music" id="bMusic" aria-label="音樂開關">♪</button>
    <button class="ibtn" data-act="pause" aria-label="暫停">II</button>
  </div>
  <div id="scene">
    <svg class="bg" id="bg" viewBox="0 0 1280 374" width="1280" height="374"></svg>
    <div id="deco"></div><div id="decoF"></div>
    <div id="custs"></div>
    <svg id="counter" viewBox="0 0 1280 74" width="1280" height="74"></svg>
    <div id="rack"></div>
    <svg id="awn" viewBox="0 0 1280 40" width="1280" height="40"></svg>
  </div>
  <div id="kitchen"></div>
  <div id="hint" hidden></div>
  <div id="toast"></div>
  <div id="banner"></div>
  <div id="fx"></div>
  <div id="home"></div>
  <div id="modal" hidden></div>
</div></div>
<div id="rotate" hidden><div class="ph"></div><div>請將手機打橫嚟玩</div><button data-act="rotok" id="rotok">照玩</button></div>

<script>
(()=>{
'use strict';
const W=1280,H=720,DAYLEN=150,LASTORDER=.93;
const $=s=>document.querySelector(s);
const stage=$('#stage');
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ================= Data ================= */
const FR={
  sz:{n:'山楂',c:1,r:13,cook:4.0,day:1},
  cm:{n:'草莓',c:3,r:15,cook:3.5,day:2},
  tz:{n:'青提',c:1,r:12,cook:3.0,day:4},
  jz:{n:'橘子',c:2,r:13,cook:3.5,day:6},
  qy:{n:'奇異果',c:3,r:15,cook:3.0,buy:'kiwi'},
};
const MENU={
  sz:{n:'山楂串',p:18,f:['sz','sz','sz','sz','sz'],day:1,w:5},
  cm:{n:'草莓串',p:28,f:['cm','cm','cm'],day:2,w:4},
  smt:{n:'酸梅湯',p:12,drink:1,day:3,w:3},
  tz:{n:'青提串',p:22,f:['tz','tz','tz','tz','tz'],day:4,w:3},
  zm:{n:'芝麻山楂',p:22,f:['sz','sz','sz','sz','sz'],ses:1,day:5,w:3},
  jz:{n:'橘子串',p:24,f:['jz','jz','jz','jz'],day:6,w:3},
  mix:{n:'什果串',p:32,f:['cm','tz','jz','sz'],day:7,w:3},
  qy:{n:'奇異果串',p:30,f:['qy','qy','qy'],buy:'kiwi',w:3},
};
const NEWS={2:['cm','草莓串','三粒大草莓，小朋友最鍾意。'],3:['smt','酸梅湯','左邊個壺可以倒酸梅湯，點一下開始倒，倒滿再點拎起。'],4:['tz','青提串','五粒青提，沾糖最快。'],5:['zm','芝麻山楂','喺草靶揀一串山楂串，再點「芝麻」撒上去。商店仲開始賣奇異果。'],6:['jz','橘子串','四瓣橘子，酸酸甜甜。'],7:['mix','什果串','草莓、青提、橘子、山楂各一粒，串齊先賣得。']};
const COST={stick:1,ses:1,cup:3,sugar:10};
const mkey=f=>f.slice().sort().join(',');
const RBK={};for(const k in MENU){const m=MENU[k];if(!m.drink&&!m.ses)RBK[mkey(m.f)]=k}

const UPS=[

function dip(i){

  if(i<0||R.pot[i])i=R.pot.findIndex(p=>!p);

function dipBoard(bi,i){

  R.pot[i]={f:b.f.slice(),t:0,cook,win:5+(S.up.slow?3:0),burnt:0};

function collect(i){

/* ================= Loop ================= */
function wantList(){const w=[];R.custs.filter(c=>c.state==='wait').sort((a,b)=>a.pat-b.pat).forEach(c=>c.ord.forEach(o=>!o.done&&w.push(o.k)));return w}
function pickDeficit(){
  const base=k=>k==='zm'?'sz':k,sup={};
  const add=k=>{if(k){k=base(k);sup[k]=(sup[k]||0)+1}};
  R.rack.forEach(x=>x&&add(x.k));R.pot.forEach(p=>p&&add(RBK[mkey(p.f)]));
  R.boards.forEach((b,ix)=>{if(ix!==1&&b.st&&b.f.length)add(RBK[mkey(b.f)]||null)});
  for(const k of wantList()){if(MENU[k].drink)continue;const bk=base(k);if(sup[bk]>0){sup[bk]--;continue}if(MENU[bk].f.every(fruitOpen))return bk}
  return null;
}
function staffTick(dt){

  if(st.keeper)R.pot.forEach((p,i)=>{if(p&&p.t>=p.cook+.6&&p.t<p.cook+p.win&&R.rack.some(x=>!x))collect(i)});
  if(st.drinker&&smtOpen()){R.h.dr-=dt;if(R.h.dr<=0){R.h.dr=.8;const need=wantList().filter(k=>k==='smt').length,have=R.taps.filter(t=>t.on||t.ready).length;if(need>have){const e=R.taps.findIndex(t=>!t.on&&!t.ready);if(e>=0&&S.coins>=COST.cup){S.coins-=COST.cup;R.cost+=COST.cup;R.taps[e].on=1;R.taps[e].f=0;sfx('pour')}}}}
  if(helperBoard()===1){
    const b=R.boards[1];R.h.sk-=dt;if(R.h.sk>0)return;R.h.sk=1.0;
    if(!b.st){const k=pickDeficit();if(!k)return;b.tgt=k}
    const f=MENU[b.tgt].f;
    if(b.f.length<f.length){const fk=f[b.f.length],c=FR[fk].c+(b.st?0:COST.stick);if(S.coins<c)return;S.coins-=c;R.cost+=c;b.st=1;b.f.push(fk);sfx('plop')}
    else if(R.melt<=0&&R.syrup>0){const i=R.pot.findIndex(p=>!p);if(i>=0)dipBoard(1,i)}
  }
}
function clockH(){return 18+Math.min(1,R.t/DAYLEN)*6}
function period(h){return h<19?'開檔':h<20.5?'晚市高峰':h<21.5?'散步時段':h<23?'宵夜高峰':'收檔前'}
function rush(h){return h<19?.85:h<20.5?1.5:h<21.5?.95:h<23?1.4:.75}
function update(dt){
  R.t+=dt;const h=clockH();

    if(R.evd.tour&&!R.tourDone&&h>=21){R.tourDone=true;banner('旅行團到！');let n=0;const go=()=>{if(spawn()&&++n<5)setTimeout(go,350)};go()}
  }
  for(const c of R.custs){

    else if(c.state==='wait'){
      c.pat-=dt;if(c.sayT>0){c.sayT-=dt;if(c.sayT<=0)c.el.querySelector('.say').classList.remove('on')}
      if(c.happyT>0)c.happyT-=dt;

      const bar=c.el.querySelector('.patb i');bar.style.width=(clamp(f,0,1)*100).toFixed(1)+'%';bar.style.background=f>.55?'var(--jade)':f>.25?'var(--warn)':'var(--bad)';
      if(c.pat<=0){R.angry++;leave(c,false);sfx('bad')}
    }
  }
  for(const p of R.pot)if(p){p.t+=dt;if(!p.burnt&&p.t>=p.cook+p.win){p.burnt=1;sfx('burn')}if(!p.dinged&&p.t>=p.cook){p.dinged=1;sfx('ding')}}
  if(R.melt>0){R.melt-=dt;if(R.melt<=0){R.melt=0;R.syrup=S.up.syrup;sfx('ding')}}
  const ft=S.up.tapfast?2:4;
  for(const t of R.taps)if(t.on&&!t.ready){t.f+=dt/ft;if(t.f>=1){t.f=1;t.ready=1;sfx('ding')}}
  if(!R.noStaff)staffTick(dt);

}

  const got=g.filter(x=>p>=x).length;if(R&&got>R.starsShown){R.starsShown=got;sfx('star',got);toast(`攞到第 ${got} 粒星！`)}
  const h=R?clockH():18,hh=Math.floor(h),mm=Math.floor((h-hh)*60/5)*5;
  setH($('#hClock'),'clk',`${String(hh%24).padStart(2,'0')}:${String(mm).padStart(2,'0')}<small>${R?period(h):'開檔'}</small>`);
  setH($('#hCoins'),'coins',`銀包 ${money(S.coins)}`);
}
function hint(){
  const e=$('#hint');
  if(!R||S.day>2||MODE!=='play'){e.hidden=true;return}
  let t='';
  const b=activeBoard(),anyDone=R.pot.some(p=>p&&p.t>=p.cook&&p.t<p.cook+p.win),rackHas=R.rack.some(Boolean),waiting=R.custs.some(c=>c.state==='wait');
  if(R.sel)t='再點想要呢樣嘢嘅客人，送畀佢';
  else if(anyDone)t='糖衣金黃發亮！點糖鍋入面嗰串，插上草靶';
  else if(rackHas&&waiting)t='點草靶上面嘅糖葫蘆揀起佢';
  else if(R.syrup<=0&&R.melt<=0)t='冇糖漿喇，點「白糖」熬一鍋';
  else if(b.st&&b.f.length>=5||b.st&&b.f.length===3&&b.f.every(k=>k==='cm'))t='串好喇！點「糖鍋」沾糖漿';
  else if(b.st&&b.f.length)t=`繼續點水果，串滿佢（${b.f.length}/${b.f[0]==='cm'?3:5}）`;
  else if(R.pot.some(Boolean))t='等糖衣掛好…順手串定下一串';
  else t=S.day===1?'點「山楂」開始串，要串 5 粒':'睇清楚客人要咩，點水果開始串';
  e.textContent=t;e.hidden=false;
}
function highlightCust(){if(!R)return;const s=R.sel;const k=s?(s.t==='rack'?R.rack[s.i]&&R.rack[s.i].k:'smt'):null;R.custs.forEach(c=>c.el.classList.toggle('hl',!!k&&c.state==='wait'&&c.ord.some(o=>!o.done&&o.k===k)))}
let last=0,SPEED=1;
function frame(ts){
  const dt=Math.min(.1,(ts-last)/1000||0);last=ts;
  if(MODE==='play'&&R&&!PAUSE&&!R.ended){for(let i=0;i<SPEED;i++)if(!R.ended)update(dt)}
  if(R&&MODE==='play'){renderKitchen();renderRack();highlightCust()}
  renderHUD();hint();
  requestAnimationFrame(frame);
}

/* ================= Flow ================= */
function modal(html){const m=$('#modal');m.innerHTML=`<div class="card">${html}</div>`;m.hidden=false}
function closeModal(){$('#modal').hidden=true}
function clearCusts(){$('#custs').innerHTML=''}
function showHome(){
  MODE='home';$('#hint').hidden=true;
  const best=Object.keys(S.stars).length;
  const fresh=S.day===1&&!S.served;
  $('#home').hidden=false;
  $('#home').innerHTML=`<svg class="hbg" viewBox="0 0 1280 720" width="1280" height="720"><defs><radialGradient id="hg" cx=".72" cy=".45" r=".6"><stop offset="0" stop-color="#5a2438"/><stop offset="1" stop-color="#140a2a"/></radialGradient></defs><rect width="1280" height="720" fill="url(#hg)"/>${Array.from({length:40},(_,i)=>`<circle cx="${(i*137)%1280}" cy="${(i*71)%300}" r="${1+(i%3)}" fill="#ffe9a0" opacity="${.2+(i%5)*.1}"/>`).join('')}<g transform="translate(820 90) rotate(-14)">${[0,1,2].map(i=>`<g transform="translate(${i*110} ${i*30}) scale(3.1)">${skewer(i===1?['cm','cm','cm']:i===2?['cm','tz','jz','sz']:['sz','sz','sz','sz','sz'],'done',i===0).replace(/<\/?svg[^>]*>/g,'')}</g>`).join('')}</g><path d="M0 640Q640 600 1280 640V720H0z" fill="#2a1622"/></svg>
  <div class="logo"><div class="t1">串串甜！</div><div class="t2">冰糖葫蘆夜市小檔</div><div class="t3">喺夜市開檔賣冰糖葫蘆：串水果、沾糖漿、插草靶、送畀街坊。糖衣要啱啱金黃先好拎起，遲一步就焦。每晚賺夠錢攞星，收檔去升級個檔口，仲可以請幫手。</div></div>
  <div class="hbtns"><button class="btn pri" data-act="startDay">${fresh?'開檔做生意':`繼續：第 ${S.day} 天`}</button><button class="btn" data-act="shop" ${fresh?'hidden':''}>攤檔升級</button><button class="btn" data-act="howto">玩法說明</button><button class="btn" data-act="music" id="hMusicBtn">音樂：${S.music?'開':'關'}</button><button class="btn" data-act="reset" ${fresh?'hidden':''}>由頭開始</button></div>
  <div class="hstat">${fresh?'':`銀包 ${money(S.coins)} · 已招呼 ${S.served} 位客人 · 過咗 ${best} 晚`}</div>`;
}
const HOME_ACT={
  startDay(){ac();musicOn();if(!S.help){S.help=1;save();howto(true);return}dayIntro()},
  howto(){howto(false)},
  shop(){shop('up',false)},
  reset(){modal(`<h2>由頭開始？</h2><p>所有進度、銀包同升級都會清走，返去第 1 天。</p><div class="btns"><button class="btn pri" data-act="resetYes">確定清走</button><button class="btn" data-act="closeM">唔好喇</button></div>`)},
  resetYes(){const m=S.music;S=clone(DEF);S.music=m;save();closeModal();showHome()},
  closeM(){closeModal()},
  goDay(){closeModal();beginDay()},
  next(){closeModal();clearCusts();R=null;dayIntro()},
  retry(){closeModal();clearCusts();R=null;dayIntro()},
  toShop(){shop('up',true)},
  home(){closeModal();clearCusts();R=null;showHome()},
  howDone(){closeModal();if(MODE==='home'&&$('#modal').dataset.fromStart==='1'){$('#modal').dataset.fromStart='';dayIntro()}else if(MODE==='play'&&PAUSE){ACT.pause()}},
  stab(el){shop(el.dataset.tab,el.dataset.after==='1')},
  buy(el){const id=el.dataset.id,tab=el.dataset.tab,after=el.dataset.after==='1';
    const all=[...UPS,...NEWITEMS.map(x=>({...x,ok:()=>!S.own[x.id],go:()=>S.own[x.id]=1,done:()=>!!S.own[x.id]})),...DECO.map(x=>({...x,ok:()=>!S.dec[x.id],go:()=>S.dec[x.id]=1,done:()=>!!S.dec[x.id]})),...STAFF.map(x=>({...x,ok:()=>!S.staff[x.id]&&(!x.need||x.need()),go:()=>S.staff[x.id]=1,done:()=>!!S.staff[x.id]}))];
    const u=all.find(x=>x.id===id);if(!u||u.done()||!u.ok()||S.coins<u.cost)return;S.coins-=u.cost;u.go();save();sfx('coin');drawDeco();renderRack();shop(tab,after)},
  fire(el){delete S.staff[el.dataset.id];save();sfx('trash');shop(el.dataset.tab,el.dataset.after==='1')},
  borrow(){S.coins+=150;save();closeModal();dayIntro()},
};
function howto(fromStart){
  $('#modal').dataset.fromStart=fromStart?'1':'';
  modal(`<h2>點樣賣糖葫蘆</h2><div class="how">
  <div class="n">1</div><div>睇客人頭頂個<b>氣泡</b>，佢要咩就整咩。下面條橫額係<b>耐性</b>，變紅就快嬲走。</div>
  <div class="n">2</div><div>點右下角嘅<b>水果</b>，會自動放竹籤喺<b>串籤板</b>，一粒粒串上去。山楂串要 5 粒、草莓串要 3 粒。</div>
  <div class="n">3</div><div>串好就點<b>糖鍋</b>沾糖漿。糖衣變到<b>金黃發亮</b>就點佢，會插上左上角嘅<b>草靶</b>。等太耐條橫額閃紅，就會<b>焦</b>。</div>
  <div class="n">4</div><div>點草靶上面嗰串揀起佢，再點<b>客人</b>送上。想要嗰位客人會發光。</div>
  <div class="n">5</div><div>每鍋糖漿沾得幾串，用完要點<b>白糖</b>再熬。串錯咗或者焦咗，就揀起佢再點<b>垃圾桶</b>。</div>
  <div class="n">6</div><div>每晚 18:00 開檔、00:00 收檔。<b>淨利</b>（收入減成本）攞夠一粒星先可以去下一晚，賺到嘅錢可以升級檔口。</div></div>
  <div class="btns"><button class="btn pri" data-act="howDone">${fromStart?'明白，開檔！':'知道喇'}</button></div>`);
}
function dayIntro(){
  MODE='home';
  if(S.coins<15){modal(`<h2>銀包見底</h2><p>連買竹籤嘅錢都唔夠……問阿媽借住 $150 頂住先。</p><div class="btns"><button class="btn pri" data-act="borrow">借 $150</button></div>`);return}
  newRun();$('#home').hidden=true;clearCusts();sig={};drawDeco();
  const g=goals(S.day),nw=NEWS[S.day],ev=R.ev?EVS[R.ev]:null;
  modal(`<h2>第 ${S.day} 晚</h2><p>夜市 18:00 開檔，00:00 收檔，23:35 最後落單。</p>
  ${nw?`<div class="news">${orderIcon(nw[0])}<div><b>新款：${nw[1]}（${money(MENU[nw[0]].p)}）</b><p>${nw[2]}</p></div></div>`:''}
  ${ev?`<div class="ev"><div class="ic">${ev.ic}</div><div><b>${ev.n}</b><p style="margin:2px 0 0">${ev.d}</p></div></div>`:''}
  ${(()=>{const ws=STAFF.filter(x=>S.staff[x.id]);return ws.length?`<p>今晚有 ${ws.map(x=>x.n).join('、')} 幫手，開檔時扣人工 ${money(ws.reduce((a,x)=>a+x.wage,0))}。</p>`:''})()}
  <h3>今晚目標（淨利）</h3><div class="goals">${g.map((x,i)=>`<div class="goal">${'★'.repeat(i+1)}<span>${money(x)}</span></div>`).join('')}</div>
  <div class="btns"><button class="btn pri" data-act="goDay">開檔！</button><button class="btn" data-act="toShop">攤檔升級</button><button class="btn" data-act="home">返主頁</button></div>`);
  renderKitchen();renderRack();
}
function beginDay(){
  if(!R)newRun();
  MODE='play';PAUSE=false;$('#home').hidden=true;
  // rebuild run containers in case upgrades changed
  R.boards=Array.from({length:S.up.boards},()=>({st:0,f:[]}));R.pot=Array.from({length:S.up.pot},()=>null);R.rack=Array.from({length:S.up.rack},()=>null);R.taps=Array.from({length:S.up.taps},()=>({f:0,on:0,ready:0}));R.syrup=S.up.syrup;
  R.snap=clone(S);sig={};
  const wage=STAFF.reduce((a,x)=>a+(S.staff[x.id]?x.wage:0),0);R.wage=0;R.noStaff=0;
  if(wage){if(S.coins>=wage){S.coins-=wage;R.cost+=wage;R.wage=wage}else{R.noStaff=1;setTimeout(()=>toast('銀包唔夠出人工，幫手今晚休息'),1500)}}
  banner('開檔！');sfx('open');ac();musicOn();
}
function endDay(){
  R.ended=true;MODE='end';sfx('close');banner('收檔！');
  const p=profit(),g=goals(S.day),st=g.filter(x=>p>=x).length;
  const d=S.day;
  if(st>0){S.stars[d]=Math.max(S.stars[d]||0,st);S.day++}
  save();
  setTimeout(()=>{
    modal(`<h2>第 ${d} 晚 收檔</h2><div class="bigstars">${[1,2,3].map(i=>`<span class="${i<=st?'on':''}">★</span>`).join('')}</div>
    <div class="sum"><span>營業額（連貼士）</span><b>${money(R.rev)}</b><span>其中貼士</span><b>${money(R.tips)}</b><span>材料成本</span><b>-${money(R.cost-R.wage)}</b>${R.wage?`<span>幫手人工</span><b>-${money(R.wage)}</b>`:''}<span class="tot">淨利</span><b class="tot">${p<0?'-':''}${money(Math.abs(p))}</b><span>招呼咗</span><b>${R.served} 位</b><span>嬲咗走</span><b>${R.angry} 位</b></div>
    <p>${st>0?(st===3?'三粒星！成條街都講緊你檔糖葫蘆。':'做得唔錯，聽晚再努力！'):`差少少先夠一粒星（${money(g[0])}）。今晚會由頭再嚟過。`}</p>
    <div class="btns">${st>0?`<button class="btn pri" data-act="next">去第 ${S.day} 晚</button><button class="btn" data-act="toShop">攤檔升級</button>`:`<button class="btn pri" data-act="retry">再挑戰</button>`}<button class="btn" data-act="home">返主頁</button></div>`);
  },1500);
}
function shop(tab='up',after){
  const all={up:UPS.filter(u=>!u.vis||u.vis()),new:NEWITEMS.map(x=>({...x,ok:()=>!S.own[x.id]&&S.day>=x.day,done:()=>!!S.own[x.id],need:`第 ${x.day} 天開始有得賣`})),dec:DECO.map(x=>({...x,ok:()=>!S.dec[x.id],done:()=>!!S.dec[x.id]})),staff:STAFF.filter(x=>!x.vis||x.vis()).map(x=>({...x,ok:()=>!S.staff[x.id]&&(!x.need||x.need()),done:()=>!!S.staff[x.id],need:x.needT,staff:1}))};
  const list=all[tab];
  modal(`<div class="wallet">銀包 ${money(S.coins)}</div><h2>攤檔升級</h2>
  <div class="tabs">${[['up','設備'],['new','新貨'],['staff','幫手'],['dec','裝飾']].map(([k,n])=>`<button class="tab ${k===tab?'on':''}" data-act="stab" data-tab="${k}" data-after="${after?1:0}">${n}</button>`).join('')}</div>
  <div class="shop">${list.map(u=>{const done=u.done(),ok=u.ok();return `<div class="up ${done&&!u.staff?'done':''}">${u.staff?`<div style="display:flex;gap:8px;align-items:center"><div class="badge" style="position:static;width:auto"><div class="av">${face(u.look)}</div></div><b>${u.n}</b></div>`:`<b>${u.n}</b>`}<p>${u.d}${u.staff?`<br><b style="font-size:13px">每晚人工 ${money(u.wage)}</b>`:''}</p><div class="row"><span class="price">${u.staff?'請佢 ':''}${money(u.cost)}</span>${done&&u.staff?`<button class="sbtn" data-act="fire" data-id="${u.id}" data-tab="${tab}" data-after="${after?1:0}" style="background:#fff">辭退</button>`:done?'<span>已擁有</span>':ok?`<button class="sbtn" data-act="buy" data-id="${u.id}" data-tab="${tab}" data-after="${after?1:0}" ${S.coins<u.cost?'disabled':''}>${u.staff?'請佢':'購買'}</button>`:`<span style="font-size:12px">${u.need||''}</span>`}</div></div>`}).join('')}</div>
  <div class="btns">${MODE==='home'&&R&&!R.ended?`<button class="btn pri" data-act="goDay">開檔！</button>`:''}${MODE==='end'?`<button class="btn pri" data-act="next">去第 ${S.day} 晚</button>`:''}<button class="btn" data-act="${MODE==='home'&&R?'reIntro':'home'}">${MODE==='home'&&R?'返回':'返主頁'}</button></div>`);
}
HOME_ACT.reIntro=()=>{R=null;dayIntro()};

/* ================= Input ================= */
let lastTapT=0;
stage.addEventListener('pointerdown',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  ac();
  const n=a.dataset.act;
  if(HOME_ACT[n]){e.preventDefault();HOME_ACT[n](a);return}
  if(n==='music'||n==='pause'||n==='resume'||n==='quit'){ACT[n](a);return}
  if(MODE!=='play'||PAUSE||!R||R.ended)return;
  if(ACT[n])ACT[n](a);
});
document.addEventListener('pointerdown',e=>{if(e.target.closest('#rotok'))ACT.rotok()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MODE==='play'){PAUSE?ACT.resume():ACT.pause()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&MODE==='play'&&!PAUSE)ACT.pause()});

let rotDismiss=false;
function fit(){const w=innerWidth,h=innerHeight,k=Math.min(w/W,h/H);stage.style.transform=`translate(${(w-W*k)/2}px,${(h-H*k)/2}px) scale(${k})`;$('#rotate').hidden=rotDismiss||!(h>w&&w<760)}
addEventListener('resize',fit);

/* ================= Boot ================= */
drawBG();buildKitchen();drawDeco();syncMusicBtn();fit();
R=null;renderRack();showHome();
requestAnimationFrame(frame);
window.__TH={get R(){return R},get S(){return S},ACT,HOME_ACT,set speed(v){SPEED=v}};
})();
</script>
